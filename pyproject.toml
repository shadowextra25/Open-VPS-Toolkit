[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openvps-toolkit"
version = "1.0.0"
description = "Lightweight read-only Linux VPS diagnostics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Raj.hehe"}]
dependencies = []

[project.scripts]
openvps = "openvps.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
