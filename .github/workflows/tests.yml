name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          PYTHONPATH=src python -m openvps --version
          PYTHONPATH=src python -m openvps --json /tmp/openvps-report.json
          python -m json.tool /tmp/openvps-report.json >/dev/null
